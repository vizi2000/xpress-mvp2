    <script type="module">
        import { Validators } from '../../src/utils/Validators.js';
        import { ALL_CITY_IDS, CITY_GROUPS } from '../../src/config/cities.config.js';

        /**
         * Simple Test Runner for Browser-Based Testing
         */
        class TestRunner {
            constructor() {
                this.tests = [];
                this.categories = new Map();
                this.passed = 0;
                this.failed = 0;
                this.startTime = null;
                this.currentCategory = null;
            }

            category(name) {
                this.currentCategory = name;
                if (!this.categories.has(name)) {
                    this.categories.set(name, []);
                }
            }

            test(name, testFunction) {
                const test = {
                    name,
                    testFunction,
                    category: this.currentCategory || 'Uncategorized'
                };
                this.tests.push(test);

                if (this.currentCategory) {
                    this.categories.get(this.currentCategory).push(test);
                }
            }

            async run() {
                this.startTime = performance.now();
                console.log('🚀 Running Validators City Logic Tests...\n');
                console.log('='.repeat(60));

                document.querySelector('.loading').remove();

                for (const test of this.tests) {
                    const testStartTime = performance.now();
                    try {
                        await test.testFunction();
                        const duration = performance.now() - testStartTime;
                        this.passed++;
                        this.logPass(test.name, test.category, duration);
                    } catch (error) {
                        const duration = performance.now() - testStartTime;
                        this.failed++;
                        this.logFail(test.name, test.category, error.message, duration);
                    }
                }

                this.printSummary();
            }

            logPass(name, category, duration) {
                console.log(`✅ PASS: ${name}`);
                this.appendResult('pass', name, category, '', duration);
            }

            logFail(name, category, message, duration) {
                console.error(`❌ FAIL: ${name}\n   ${message}`);
                this.appendResult('fail', name, category, message, duration);
            }

            appendResult(status, name, category, message = '', duration = 0) {
                let categoryDiv = document.querySelector(`[data-category="${category}"]`);

                if (!categoryDiv) {
                    const categoryContainer = document.createElement('div');
                    categoryContainer.className = 'test-category';
                    categoryContainer.innerHTML = `
                        <div class="test-category-title">${category}</div>
                        <div class="test-category-results" data-category="${category}"></div>
                    `;
                    document.getElementById('test-results').appendChild(categoryContainer);
                    categoryDiv = categoryContainer.querySelector('.test-category-results');
                }

                const testDiv = document.createElement('div');
                testDiv.className = `test-result test-${status}`;
                testDiv.innerHTML = `
                    <span class="test-status">${status === 'pass' ? '✅' : '❌'}</span>
                    <div class="test-content">
                        <div class="test-name">${name}</div>
                        ${message ? `<div class="test-error">${this.escapeHtml(message)}</div>` : ''}
                        <div class="test-duration">${duration.toFixed(2)}ms</div>
                    </div>
                `;
                categoryDiv.appendChild(testDiv);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            printSummary() {
                const total = this.passed + this.failed;
                const percentage = ((this.passed / total) * 100).toFixed(1);
                const totalDuration = (performance.now() - this.startTime).toFixed(2);

                const summaryDiv = document.getElementById('test-summary');
                summaryDiv.innerHTML = `
                    <h2>Test Summary</h2>
                    <div class="summary-stats">
                        <div class="stat">
                            <div class="stat-value">${total}</div>
                            <div class="stat-label">Total Tests</div>
                        </div>
                        <div class="stat stat-pass">
                            <div class="stat-value">${this.passed}</div>
                            <div class="stat-label">Passed</div>
                        </div>
                        <div class="stat stat-fail">
                            <div class="stat-value">${this.failed}</div>
                            <div class="stat-label">Failed</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${percentage}%</div>
                            <div class="stat-label">Pass Rate</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${totalDuration}</div>
                            <div class="stat-label">Duration (ms)</div>
                        </div>
                    </div>
                `;

                console.log('='.repeat(60));
                console.log(`\n📊 SUMMARY:`);
                console.log(`   Total:     ${total}`);
                console.log(`   Passed:    ${this.passed} ✅`);
                console.log(`   Failed:    ${this.failed} ❌`);
                console.log(`   Pass Rate: ${percentage}%`);
                console.log(`   Duration:  ${totalDuration}ms`);
                console.log('\n' + '='.repeat(60));

                if (this.failed === 0) {
                    console.log('🎉 ALL TESTS PASSED!');
                } else {
                    console.warn(`⚠️  ${this.failed} test(s) failed. Please review above.`);
                }
            }
        }

        /**
         * Assertion helpers
         */
        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        function assertEqual(actual, expected, message) {
            if (actual !== expected) {
                throw new Error(
                    message || `Expected "${expected}", but got "${actual}"`
                );
            }
        }

        function assertNotEqual(actual, expected, message) {
            if (actual === expected) {
                throw new Error(
                    message || `Expected value to not equal "${expected}"`
                );
            }
        }

        function assertNull(value, message) {
            if (value !== null) {
                throw new Error(
                    message || `Expected null, but got "${value}"`
                );
            }
        }

        function assertNotNull(value, message) {
            if (value === null) {
                throw new Error(
                    message || 'Expected non-null value, but got null'
                );
            }
        }

        function assertTrue(value, message) {
            if (value !== true) {
                throw new Error(
                    message || `Expected true, but got "${value}"`
                );
            }
        }

        function assertFalse(value, message) {
            if (value !== false) {
                throw new Error(
                    message || `Expected false, but got "${value}"`
                );
            }
        }
