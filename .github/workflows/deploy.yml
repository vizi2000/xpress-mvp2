name: 🚀 Deploy Xpress.Delivery MVP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-js-version: '18'
        
    - name: 📋 Validate configuration
      run: |
        echo "🔍 Validating application configuration..."
        # Basic validation - check if files exist and are valid
        if [ ! -f "index-modular.html" ]; then
          echo "❌ Main application file not found"
          exit 1
        fi
        if [ ! -f "src/config/env.config.js" ]; then
          echo "❌ Environment configuration not found"
          exit 1
        fi
        echo "✅ Application configuration valid"

    - name: 🔑 Setup SSH key for deployment
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🔐 Setting up SSH key for borg.tools..."
        mkdir -p ~/.ssh
        echo "${{ secrets.BORG_TOOLS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H borg.tools >> ~/.ssh/known_hosts
        echo "✅ SSH key configured"

    - name: 🚀 Deploy to borg.tools
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🚀 Deploying to production server (sendxpress.borg.tools)..."
        ssh vizi@borg.tools './deploy.sh sendxpress main'
        echo "✅ Deployment completed"

    - name: 🧪 Test deployment
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "🧪 Testing production deployment..."
        sleep 5
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://sendxpress.borg.tools)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Production site is responding (HTTP $HTTP_CODE)"
        else
          echo "⚠️ Production site returned HTTP $HTTP_CODE"
        fi

  security-check:
    runs-on: ubuntu-latest
    steps:
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    - name: 🔒 Check for secrets in code
      run: |
        echo "🔍 Scanning for potential secrets in committed files..."

        # Check that config.local.js uses placeholders (most important check)
        if ! grep -q "__LOCATIONIQ_API_KEY__" config.local.js; then
          echo "❌ config.local.js missing placeholder for LocationIQ - SECURITY ISSUE!"
          exit 1
        fi

        if ! grep -q "__GOOGLE_MAPS_API_KEY__" config.local.js; then
          echo "❌ config.local.js missing placeholder for Google Maps - SECURITY ISSUE!"
          exit 1
        fi

        # Check for API keys with actual values (not placeholders)
        # LocationIQ API key pattern: pk. followed by 40 hex chars
        LOCATIONIQ_MATCHES=$(grep -r "pk\.[a-f0-9]\{40\}" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.log" --exclude="deploy.yml" 2>/dev/null || true)
        if [ -n "$LOCATIONIQ_MATCHES" ]; then
          echo "❌ Found potential LocationIQ API key in committed files:"
          echo "$LOCATIONIQ_MATCHES"
          exit 1
        fi

        # Google Maps API key pattern: AIzaSy followed by 33 chars
        GMAPS_MATCHES=$(grep -r "AIzaSy[A-Za-z0-9_-]\{33\}" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.log" --exclude=".env.*" --exclude="deploy.yml" 2>/dev/null || true)
        if [ -n "$GMAPS_MATCHES" ]; then
          echo "❌ Found Google API key in committed files:"
          echo "$GMAPS_MATCHES"
          exit 1
        fi

        echo "✅ Security scan completed - no hardcoded secrets found"

    - name: 📋 Validate .gitignore
      run: |
        echo "🔍 Checking .gitignore configuration..."
        if grep -q "\.env" .gitignore; then
          echo "✅ .env files are gitignored"
        else
          echo "❌ .env files not in .gitignore - SECURITY ISSUE!"
          exit 1
        fi

        echo "✅ .gitignore validation completed"